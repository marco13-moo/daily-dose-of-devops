name: Daily Dose of DevOps

permissions:
  contents: write

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: |
          npm run build
          echo "=== dist tree ==="
          ls -R dist

      - name: Generate and publish blog
        env:
          HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
          HUGGINGFACE_MODEL: Qwen/Qwen2.5-7B-Instruct
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
        run: npm run daily

      - name: Preserve generated post and publication state
        if: ${{ always() }}
        run: |
          git config user.name "devops-bot"
          git config user.email "bot@github.com"
          git add content/published.json content/generated/
          git diff --cached --quiet || git commit -m "chore: preserve daily blog output"
          git push
